name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: python -m py_compile lambda_function.py

      - name: Validate IAM policy JSON
        run: |
          for f in policies/*.json; do
            echo "Validating $f"
            python -m json.tool "$f" > /dev/null
          done

      - name: Shellcheck deploy scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
