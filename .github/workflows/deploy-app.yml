name: Deploy App

# Stage 2a: application deploy. Packages lambda_function.py and updates the
# Lambda's code + config. Runs automatically after checks pass on master,
# and only when app-relevant files change. Does not touch IAM roles or the
# EventBridge schedule - see deploy-infra.yml for that.

on:
  push:
    branches: [master]
    paths:
      - 'lambda_function.py'
      - 'scripts/deploy-app.sh'
      - 'scripts/lib.sh'
  workflow_dispatch: {}

jobs:
  deploy:
    name: deploy-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy application
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          GOVEE_DEVICE_FILTER: ${{ vars.GOVEE_DEVICE_FILTER }}
          LATITUDE: ${{ vars.LATITUDE }}
          LONGITUDE: ${{ vars.LONGITUDE }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          START_KELVIN: ${{ vars.START_KELVIN }}
          END_KELVIN: ${{ vars.END_KELVIN }}
          STEP_COUNT: ${{ vars.STEP_COUNT }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: ./scripts/deploy-app.sh
