name: Deploy Infra

# Stage 2b: infrastructure deploy. Creates/updates the two IAM roles and the
# recurring EventBridge schedule. Runs automatically after checks pass on
# master, and only when infra-relevant files change. Does not touch the
# Lambda function's code - see deploy-app.yml for that.

on:
  push:
    branches: [master]
    paths:
      - 'policies/**'
      - 'scripts/deploy-infra.sh'
      - 'scripts/lib.sh'
  workflow_dispatch: {}

jobs:
  deploy:
    name: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy infrastructure
        env:
          PLAN_CRON_UTC: ${{ vars.PLAN_CRON_UTC }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: ./scripts/deploy-infra.sh
